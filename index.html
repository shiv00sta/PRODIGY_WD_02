<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch Web Application | Task 02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stopwatch-container">
    <h1>Stopwatch</h1>
    
    <div class="display" id="display">00:00:00.<span class="millis">00</span></div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">Start</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>Pause</button>
      <button id="lapBtn" class="btn btn-lap" disabled>Lap</button>
      <button id="resetBtn" class="btn btn-reset" disabled>Reset</button>
    </div>

    <div class="laps-container">
      <h2>Laps</h2>
      <ul id="lapsList" class="laps-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
